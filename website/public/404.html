<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 · 未曝光的画幅 | 澄影 Chengying</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        background: radial-gradient(circle at 50% 24%, #17171d 0%, #09090b 68%);
        color: #f2ede4;
        font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans CJK SC', sans-serif;
      }
      main {
        max-width: 34rem;
        text-align: center;
        border: 1px solid rgba(242, 237, 228, 0.14);
        padding: 3rem 2.5rem;
        background: rgba(17, 17, 21, 0.78);
      }
      .frame-code {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.78rem;
        letter-spacing: 0.22em;
        color: #d49b54;
        text-transform: uppercase;
      }
      h1 {
        margin: 1rem 0 0.75rem;
        font-family: Georgia, 'Songti SC', 'Noto Serif CJK SC', serif;
        font-weight: 500;
        font-size: 2.1rem;
        letter-spacing: 0.04em;
      }
      p {
        margin: 0 0 1.8rem;
        color: #a9a297;
        line-height: 1.75;
        font-size: 0.96rem;
      }
      a {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.7rem 1.4rem;
        border: 1px solid rgba(212, 155, 84, 0.55);
        color: #f2ede4;
        text-decoration: none;
        font-size: 0.9rem;
        letter-spacing: 0.08em;
        transition: background 180ms ease, border-color 180ms ease;
      }
      a:hover {
        background: rgba(212, 155, 84, 0.14);
        border-color: #d49b54;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="frame-code">FRAME 404 · UNEXPOSED NEGATIVE</div>
      <h1>这一格底片尚未显影</h1>
      <p>你访问的页面路径不存在，但原片在澄影的只读工作区中始终完好无损。</p>
      <a href="./">返回澄影暗房首页 →</a>
    </main>
  </body>
</html>
