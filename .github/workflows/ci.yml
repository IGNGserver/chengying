name: CI

# Heavy work only on pull requests (Actions minutes are a monthly budget).
# Engine tests (darktable / RawTherapee) and the DSH end-to-end suite need
# locally installed engines / a Harness runtime and run on developer machines.
on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'native/**'
      - 'scripts/**'
      - 'package.json'
      - 'presets/**'
      - 'pnpm-lock.yaml'
      - 'tsconfig.json'
      - 'vitest*.ts'
      - 'VERSION'
      - 'README.md'
      - 'AGENTS.md'
      - 'catalogs/**'
      - 'cordis.patch.yml'
      - 'docs/**'
      - 'icon.svg'
      - 'locale/**'
      - '.github/RELEASE_TEMPLATE.md'
      - '.github/workflows/release.yml'
      - '.github/release-notes/**'
      - '.github/workflows/ci.yml'

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Repository checks
        run: |
          git diff --check "origin/${{ github.base_ref }}...HEAD"
          python3 scripts/verify-release-version.py --version "$(tr -d '[:space:]' < VERSION)"
          python3 scripts/render-release-body.py --version "$(tr -d '[:space:]' < VERSION)" --release-type prerelease --repository "$GITHUB_REPOSITORY" --check

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Smoke-test packed artifact
        run: pnpm test:packed

      - name: Unit and integration tests
        run: pnpm test

  # Windows is a supported host, and several engine behaviours differ there
  # (darktable-cli parses its output argument as a pattern string, the native
  # introspection helper is POSIX-only, path separators, ExifTool precision).
  # Keep a second job on the real platform so those paths cannot regress.
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Unit and integration tests
        run: pnpm test

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runs-on: macos-15, arch: arm64 }
          - { runs-on: macos-15-intel, arch: x86_64 }
    name: macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          architecture: ${{ matrix.arch == 'arm64' && 'arm64' || 'x64' }}
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build
      - name: Unit and integration tests
        run: pnpm test
